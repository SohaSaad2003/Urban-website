<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI City Assistant - Urban Evolution Project</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Chat Interface Styles */
        body {
            background: linear-gradient(135deg, #041429, #0a2744);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .chat-interface {
            background: rgba(4, 20, 41, 0.5);
            border-radius: 15px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
        }

        .chat-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .chat-icon {
            font-size: 2rem;
            margin-right: 1rem;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .chat-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #ffffff;
            margin: 0;
        }

        .city-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .city-btn {
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 5px;
            color: #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .city-btn:hover {
            background: rgba(0, 255, 255, 0.2);
        }

        .city-btn.active {
            background: linear-gradient(135deg, #00ffff, #0077ff);
            color: #041429;
        }

        .chat-container {
            background: rgba(4, 20, 41, 0.3);
            border-radius: 10px;
            padding: 1rem;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            max-width: 80%;
        }

        .user-message {
            background: rgba(0, 255, 255, 0.1);
            align-self: flex-end;
            margin-left: 20%;
        }

        .assistant-message {
            background: rgba(0, 119, 255, 0.1);
            align-self: flex-start;
            margin-right: 20%;
        }

        .chat-input-container {
            display: flex;
            gap: 1rem;
        }

        #chatInput {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(4, 20, 41, 0.5);
            color: #f0f0f0;
        }

        #chatInput:focus {
            outline: none;
            border-color: rgba(0, 255, 255, 0.5);
        }

        #sendMessage {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #00ffff, #0077ff);
            border: none;
            border-radius: 5px;
            color: #041429;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #sendMessage:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
        }

        /* Custom Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(4, 20, 41, 0.3);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.2);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('chat_page') }}" class="active">Chat</a></li>
            <li><a href="{{ url_for('change_detection') }}">Change Detection</a></li>
            <li><a href="{{ url_for('analysis') }}">Analysis</a></li>
            <li><a href="{{ url_for('image_caption') }}">Image Caption</a></li>
            <li><a href="http://127.0.0.1:8080" target="_blank" rel="noopener noreferrer">Dashboard</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
        </ul>
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo">
    </nav>

    <!-- Chat Content -->
    <div class="content">
        <div class="chat-interface">
            <div class="chat-header">
                <i class="fas fa-robot chat-icon"></i>
                <h2 class="chat-title">AI City Assistant</h2>
            </div>
            <div class="city-selector">
                <button class="city-btn active" data-city="october">6th of October</button>
                <button class="city-btn" data-city="madinaty">Madinaty</button>
                <button class="city-btn" data-city="ramadan">10th of Ramadan</button>
            </div>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will appear here -->
                </div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" placeholder="Ask about city services, locations, or recommendations...">
                    <button id="sendMessage">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendMessage');
            const cityButtons = document.querySelectorAll('.city-btn');
            let currentCity = 'october';

            // City selection
            cityButtons.forEach(button => {
                button.addEventListener('click', () => {
                    cityButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    currentCity = button.dataset.city;
                    // Clear chat when switching cities
                    chatMessages.innerHTML = '';
                    addAssistantMessage(getWelcomeMessage(currentCity));
                });
            });

            function getWelcomeMessage(city) {
                switch(city) {
                    case 'october':
                        return 'مرحباً بك! أنا مساعدك للتعرف على مدينة السادس من أكتوبر. يمكنك سؤالي عن الخدمات المتوفرة، المناطق السكنية، أو أي معلومات أخرى عن المدينة.';
                    case 'madinaty':
                        return 'مرحباً بك! أنا مساعدك للتعرف على مدينة مدينتي. يمكنك سؤالي عن الخدمات المتوفرة، المناطق السكنية، أو أي معلومات أخرى عن المدينة.';
                    case 'ramadan':
                        return 'مرحباً بك! أنا مساعدك للتعرف على مدينة العاشر من رمضان. يمكنك سؤالي عن الخدمات المتوفرة، المناطق السكنية، أو أي معلومات أخرى عن المدينة.';
                }
            }

            // Add initial welcome message
            addAssistantMessage(getWelcomeMessage('october'));

            function addUserMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user-message';
                messageDiv.textContent = message;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function addAssistantMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message assistant-message';
                messageDiv.textContent = message;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            async function handleUserMessage() {
                const message = chatInput.value.trim();
                if (!message) return;

                console.log(`Sending message to ${currentCity}: ${message}`);
                addUserMessage(message);
                chatInput.value = '';

                try {
                    console.log('Making fetch request to /chat');
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: message,
                            city: currentCity
                        })
                    });

                    console.log('Received response:', response.status);
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Server error');
                    }

                    const data = await response.json();
                    console.log('Parsed response data:', data);
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    addAssistantMessage(data.response);
                } catch (error) {
                    console.error('Error in chat:', error);
                    addAssistantMessage(`عذراً، حدث خطأ في معالجة طلبك: ${error.message}`);
                }
            }

            sendButton.addEventListener('click', handleUserMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleUserMessage();
                }
            });
        });
    </script>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
