<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Caption Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .image-caption-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .upload-section {
            background: linear-gradient(135deg, rgba(4, 20, 41, 0.8), rgba(10, 39, 68, 0.8));
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 30px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        .preview-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .image-preview {
            background: rgba(4, 20, 41, 0.5);
            border-radius: 10px;
            padding: 1rem;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(0, 255, 255, 0.2);
        }

        .image-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }

        .caption-output {
            background: rgba(4, 20, 41, 0.5);
            border-radius: 10px;
            padding: 1rem;
            min-height: 300px;
            border: 2px dashed rgba(0, 255, 255, 0.2);
        }

        .caption-text {
            color: #f0f0f0;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .upload-box {
            border: 2px dashed rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-box:hover {
            border-color: rgba(0, 255, 255, 0.4);
            background: rgba(0, 255, 255, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: #00ffff;
            margin-bottom: 1rem;
        }

        .upload-text {
            color: #f0f0f0;
            margin-bottom: 1rem;
        }

        .generate-btn {
            background: linear-gradient(135deg, #00ffff, #0077ff);
            color: #041429;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
        }

        .generate-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading-spinner {
            border: 4px solid rgba(0, 255, 255, 0.1);
            border-left-color: #00ffff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('chat_page') }}">Chat</a></li>
            <li><a href="{{ url_for('change_detection') }}">Change Detection</a></li>
            <li><a href="{{ url_for('analysis') }}">Analysis</a></li>
            <li><a href="{{ url_for('image_caption') }}" class="active">Image Caption</a></li>
            <li><a href="http://127.0.0.1:8080" target="_blank" rel="noopener noreferrer">Dashboard</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
        </ul>
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo">
    </nav>

    <div class="image-caption-container">
        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <i class="fas fa-cloud-upload-alt upload-icon"></i>
                <div class="upload-text">
                    <h3>Select an Image</h3>
                    <p>Click to choose an image or drag and drop</p>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
            <button id="generateBtn" class="generate-btn" disabled>Generate Caption</button>
            <div id="errorMessage" class="error-message"></div>
            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                <p>Generating caption...</p>
            </div>
        </div>

        <div class="preview-section">
            <div class="image-preview">
                <img id="previewImage" src="" alt="" style="display: none;">
                <div id="previewPlaceholder">
                    <i class="fas fa-image" style="font-size: 3rem; color: rgba(0, 255, 255, 0.3);"></i>
                    <p style="color: rgba(0, 255, 255, 0.3); margin-top: 1rem;">Image preview will appear here</p>
                </div>
            </div>
            <div class="caption-output">
                <div id="captionText" class="caption-text">
                    <p style="color: rgba(0, 255, 255, 0.3);">Generated caption will appear here</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const uploadBox = document.getElementById('uploadBox');
            const imageInput = document.getElementById('imageInput');
            const previewImage = document.getElementById('previewImage');
            const previewPlaceholder = document.getElementById('previewPlaceholder');
            const generateBtn = document.getElementById('generateBtn');
            const captionText = document.getElementById('captionText');
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');

            // Handle file selection
            uploadBox.addEventListener('click', () => imageInput.click());
            uploadBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadBox.style.borderColor = 'rgba(0, 255, 255, 0.4)';
            });
            uploadBox.addEventListener('dragleave', () => {
                uploadBox.style.borderColor = 'rgba(0, 255, 255, 0.2)';
            });
            uploadBox.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadBox.style.borderColor = 'rgba(0, 255, 255, 0.2)';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleImageSelection(file);
                }
            });

            imageInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    handleImageSelection(file);
                }
            });

            function handleImageSelection(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                    previewPlaceholder.style.display = 'none';
                    generateBtn.disabled = false;
                    errorMessage.style.display = 'none';
                    captionText.innerHTML = '<p style="color: rgba(0, 255, 255, 0.3);">Generated caption will appear here</p>';
                };
                reader.readAsDataURL(file);
            }

            generateBtn.addEventListener('click', async () => {
                const file = imageInput.files[0];
                if (!file) return;

                loading.style.display = 'block';
                errorMessage.style.display = 'none';
                generateBtn.disabled = true;

                try {
                    const formData = new FormData();
                    formData.append('image', file);

                    const response = await fetch('/generate_caption', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to generate caption');
                    }

                    captionText.innerHTML = `<p>${data.caption}</p>`;
                } catch (error) {
                    errorMessage.textContent = error.message;
                    errorMessage.style.display = 'block';
                } finally {
                    loading.style.display = 'none';
                    generateBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
